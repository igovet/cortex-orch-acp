[workspace]
resolver = "2"
members = [
    "crates/cortex-acp",
    "crates/cortex-core",
    "crates/cortex-engine",
    "crates/cortex-xtask",
    "crates/cortex-paseo-tools",
    "crates/workspace-client",
    "crates/workspace-protocol",
    "crates/workspace-remote",
    "crates/workspace-service",
    "apps/cortex-workspace-desktop/src-tauri",
    "apps/cortex-workspace-android/src-tauri",
    "prototypes/cortex-workspace/desktop/src-tauri",
]
default-members = ["crates/workspace-protocol"]

[workspace.package]
version = "1.0.6"
edition = "2021"
rust-version = "1.99.1"
publish = false

# Reviewed inputs; update these together with the lockfiles.
[workspace.metadata.cortex-pins]
rust = "1.99.1"
tauri-cli = "2.10.1"
tauri = "2.10.1"
tauri-build = "2.5.6"
lock-sha256 = "cef9de01066661ab3535e6a8e7707eef81e5541035a5b4a24cadd79b79aac0d8"

# Debug and test builds keep only line tables (file:line backtraces). Full debuginfo
# made every test binary about 500 MB, 79% of it debug sections, and each change
# relinked dozens of them: 20-30 GB written per test run, enough to saturate the disk
# (2026-11-21). Dependencies carry no debuginfo at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
