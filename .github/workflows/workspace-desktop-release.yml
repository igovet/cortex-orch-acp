{
  "name": "Workspace release",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "workspace-desktop-release-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "build": {
      "if": "github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "permissions": {
        "contents": "read"
      },
      "outputs": {
        "version": "${{ steps.release.outputs.version }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Bind selected branch to the triggering revision",
          "run": "git checkout -B \"${GITHUB_REF#refs/heads/}\" \"$GITHUB_SHA\""
        },
        {
          "name": "Read package identity",
          "id": "identity",
          "run": "version=$(sed -n 's/^  \"version\": \"\\(.*\\)\",$/\\1/p' package-identity.json)\nprintf '%s\\n' \"$version\" | grep -Eq '^1\\.0\\.6\\+sha256\\.[0-9a-f]{16}$' || { echo 'invalid package identity' >&2; exit 1; }\nprintf 'version=%s\\n' \"$version\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "name": "Build selected channel in the shared container",
          "run": "case \"$GITHUB_REF\" in\n  refs/heads/main) channel_flag=--release ;;\n  refs/heads/dev) channel_flag=--ci-dev ;;\n  *) exit 1 ;;\nesac\ncargo run --locked --quiet -p cortex-xtask -- build-deb \"$channel_flag\" --jobs 2"
        },
        {
          "name": "Inspect archive and gather artifacts",
          "run": "mkdir release-artifacts\ncp .workspace-build/build-*/artifacts/\"${PACKAGE}\"_*.deb release-artifacts/\ncp .workspace-build/build-*/manifest.json release-artifacts/manifest.json\nfor archive in release-artifacts/*.deb; do\n  dpkg-deb -c \"$archive\"\n  dpkg-deb -I \"$archive\"\ndone\nset -- release-artifacts/*.deb\n[ \"$#\" -eq 1 ]\nversion=\"$(dpkg-deb -f \"$1\" Version)\"\nprintf 'version=%s\\n' \"$version\" >> \"$GITHUB_OUTPUT\"\n(cd release-artifacts; for archive in *.deb; do sha256sum \"$archive\" > \"$archive.sha256\"; done)",
          "id": "release"
        },
        {
          "name": "Sign and verify the release desktop update (main only)",
          "if": "github.ref == 'refs/heads/main'",
          "env": {
            "UPDATE_SIGNING_KEY_BASE64": "${{ secrets.UPDATE_SIGNING_KEY_BASE64 }}"
          },
          "run": "set -euo pipefail\n[ -n \"$UPDATE_SIGNING_KEY_BASE64\" ] || { echo 'UPDATE_SIGNING_KEY_BASE64 is not set' >&2; exit 1; }\numask 077\nkey_dir=\"$(mktemp -d \"$RUNNER_TEMP/workspace-update-signing.XXXXXXXX\")\"\nexport CORTEX_UPDATE_SIGNING_KEY=\"$key_dir/release-ed25519.key\"\ntrap 'rm -f -- \"$CORTEX_UPDATE_SIGNING_KEY\"; rmdir -- \"$key_dir\"' EXIT\nprintf '%s' \"$UPDATE_SIGNING_KEY_BASE64\" | base64 --decode > \"$CORTEX_UPDATE_SIGNING_KEY\"\nunset UPDATE_SIGNING_KEY_BASE64\numask 022\nset -- release-artifacts/*.deb\n[ \"$#\" -eq 1 ] && [ -f \"$1\" ] || { echo 'Expected one desktop archive' >&2; exit 1; }\ncargo run --locked --quiet -p cortex-xtask -- update-sign \"$1\"\ncargo run --locked --quiet -p cortex-xtask -- update-verify \"$1\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "workspace-desktop-release",
            "path": "release-artifacts/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ],
      "env": {
        "PACKAGE": "${{ github.ref == 'refs/heads/main' && 'cortex-workspace' || 'cortex-workspace-dev' }}"
      }
    },
    "android": {
      "if": "github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24"
          }
        },
        {
          "name": "Install the pinned Rust toolchain with the Android target",
          "run": "rustup show active-toolchain\nrustup target add aarch64-linux-android"
        },
        {
          "name": "Restore the signing keystore (fail closed without it)",
          "env": {
            "ANDROID_KEYSTORE_BASE64": "${{ secrets.ANDROID_KEYSTORE_BASE64 }}",
            "ANDROID_KEYSTORE_PASSWORD": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          },
          "run": "[ -n \"$ANDROID_KEYSTORE_BASE64\" ] && [ -n \"$ANDROID_KEYSTORE_PASSWORD\" ] || { echo \"Android signing secrets are not set: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD (and optionally ANDROID_KEY_ALIAS). Create the keystore with scripts/build-android-apk.sh --init-signing.\" >&2; exit 1; }\numask 077\nprintf \"%s\" \"$ANDROID_KEYSTORE_BASE64\" | base64 -d > \"$RUNNER_TEMP/release.jks\"\n[ -s \"$RUNNER_TEMP/release.jks\" ]"
        },
        {
          "name": "Build and sign the APK for the selected channel",
          "env": {
            "CORTEX_ANDROID_KEYSTORE_PASSWORD": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
            "CORTEX_ANDROID_KEY_ALIAS": "${{ secrets.ANDROID_KEY_ALIAS || 'cortex-workspace' }}"
          },
          "run": "case \"$GITHUB_REF\" in\n  refs/heads/main) channel_flag=--release ;;\n  refs/heads/dev) channel_flag= ;;\n  *) exit 1 ;;\nesac\n[ -n \"${JAVA_HOME_17_X64:-}\" ] || { echo \"JDK 17 is not available on this runner\" >&2; exit 1; }\nexport JAVA_HOME=\"$JAVA_HOME_17_X64\"\nexport NDK_HOME=\"${ANDROID_NDK_LATEST_HOME:-}\"\nexport CORTEX_ANDROID_KEYSTORE=\"$RUNNER_TEMP/release.jks\"\nscripts/build-android-apk.sh $channel_flag"
        },
        {
          "name": "Remove the keystore",
          "if": "always()",
          "run": "rm -f \"$RUNNER_TEMP/release.jks\""
        },
        {
          "name": "Gather the APK",
          "run": "mkdir android-artifacts\ncp .workspace-build/android/*.apk .workspace-build/android/*.apk.sha256 android-artifacts/\nset -- android-artifacts/*.apk\n[ \"$#\" -eq 1 ]\n(cd android-artifacts && sha256sum -c ./*.sha256)"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "workspace-android-release",
            "path": "android-artifacts/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    },
    "publish": {
      "needs": [
        "build",
        "android"
      ],
      "if": "github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "write"
      },
      "steps": [
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "workspace-desktop-release",
            "path": "release-artifacts"
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "workspace-android-release",
            "path": "android-artifacts"
          }
        },
        {
          "name": "Check exact version tag (fail closed except for 404)",
          "id": "tag",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "VERSION": "${{ needs.build.outputs.version }}"
          },
          "run": "printf '%s\\n' \"$VERSION\" | grep -Eq '^1\\.0\\.6\\+(z[0-9]{20}\\.)?sha256\\.[0-9a-f]{16}$' || { echo 'invalid package identity' >&2; exit 1; }\ncase \"$TAG_PREFIX\" in v|dev-v) ;; *) echo 'invalid tag prefix' >&2; exit 1 ;; esac\nstatus=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \\\n  -H \"Authorization: Bearer $GH_TOKEN\" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \\\n  \"$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_PREFIX$VERSION\") || { echo 'tag lookup failed' >&2; exit 1; }\ncase \"$status\" in\n  200) exists=true ;;\n  404) exists=false ;;\n  *) echo \"tag lookup failed: HTTP $status\" >&2; exit 1 ;;\nesac\nprintf 'exists=%s\\n' \"$exists\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "name": "Publish only a previously untagged version",
          "if": "steps.tag.outputs.exists == 'false'",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "VERSION": "${{ needs.build.outputs.version }}",
            "GH_REPO": "${{ github.repository }}"
          },
          "run": "case \"$GITHUB_REF\" in\n  refs/heads/main)\n    title=\"Cortex Workspace $VERSION\"\n    notes=\"Ubuntu desktop package and Android APK. Installation and service activation are explicit owner actions. The phone app connects only to machines paired from the desktop.\"\n    flags=(--latest)\n    set -- release-artifacts/*.deb.sha256.sig\n    [ \"$#\" -eq 1 ] && [ -f \"$1\" ] || { echo 'Expected one desktop signature sidecar' >&2; exit 1; }\n    signatures=(\"$1\")\n    ;;\n  refs/heads/dev)\n    title=\"Cortex Workspace Dev $VERSION\"\n    notes=\"Development build. Install the dev .deb and the dev APK manually; dev has no in-app updates.\"\n    flags=(--prerelease --latest=false)\n    signatures=()\n    ;;\n  *) exit 1 ;;\nesac\ngh release create \"$TAG_PREFIX$VERSION\" release-artifacts/*.deb release-artifacts/*.deb.sha256 \"${signatures[@]}\" \\\n  android-artifacts/*.apk android-artifacts/*.apk.sha256 \\\n  --target \"$GITHUB_SHA\" --title \"$title\" --notes \"$notes\" \"${flags[@]}\""
        }
      ],
      "env": {
        "TAG_PREFIX": "${{ github.ref == 'refs/heads/main' && 'v' || 'dev-v' }}"
      }
    }
  }
}
