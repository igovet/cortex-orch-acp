[package]
name = "workspace-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Embedded iroh remote access between a phone and the Cortex Workspace machine service"

[dependencies]
workspace-protocol = { path = "../workspace-protocol" }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
n0-future = "=0.3.2"
tokio = { version = "=1.54.1", features = ["rt", "sync", "time", "io-util", "macros"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
subtle = "=2.6.1"
data-encoding = "=2.11.1"
getrandom = "=0.4.3"
qrcode = { version = "=0.14.1", default-features = false }
libc = "=0.2.191"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
