[package]
name = "workspace-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[test]]
# The test executable doubles as its own no-model ACP peer/stdio relay.
name = "native_sessions"
harness = false

[[test]]
name = "native_desktop"
harness = false

[[test]]
# Offline launcher execution oracle and allowlisted native fake peer.
name = "codex_launcher"
harness = false

[[test]]
# Short model texts through the ACP route; the executable doubles as the no-model fake engine.
name = "short_text_engine"
harness = false

[[test]]
# Every worker profile through the real runtime; the executable is its own recording no-model peer.
name = "worker_roles"
harness = false

[dependencies]
cortex-core = { path = "../cortex-core" }
cortex-engine = { path = "../cortex-engine" }
workspace-protocol = { path = "../workspace-protocol" }
workspace-remote = { path = "../workspace-remote" }
serde ={ version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled"] }
sha1_smol = "=1.0.1"
sha2 = "=0.10.9"
base64 = "=0.22.1"
# Python `unicodedata` label sanitizing: NFKC and general categories.
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
icu_properties = "=2.4.0"
regex = "=1.13.1"
libc = "=0.2.191"
portable-pty = "=0.9.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal"] }
futures = "=0.3.34"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }
