[package]
name = "cortex-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
workspace-service = { path = "../workspace-service" }
workspace-protocol = { path = "../workspace-protocol" }
cortex-engine = { path = "../cortex-engine" }
cortex-core = { path = "../cortex-core" }
libc = "=0.2.191"
regex = "=1.13.1"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "signal", "process"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }

[[test]]
name = "incoming"
harness = false

[[test]]
name = "codex_task_trust"
harness = false

[[test]]
# Schema-validated stdio probe of the real binary (no engine prompt is dispatched).
name = "acp_binary_schema"
harness = true
