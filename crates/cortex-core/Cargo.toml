[package]
name = "cortex-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tokio = { version = "=1.54.1", features = ["sync"] }
workspace-protocol = { path = "../workspace-protocol" }
rusqlite = { version = "=0.42.0", default-features = false, features = ["libsqlite3-sys", "bundled", "backup", "functions"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rustpython-parser = { version = "=0.4.0", default-features = false, features = ["num-bigint"] }
rustpython-ast = { version = "=0.4.0", default-features = false, features = ["num-bigint", "fold"] }
sha2 = "=0.10.9"
uuid = { version = "=1.29.0", features = ["v4"] }
thiserror = "=2.0.21"
libc = "=0.2.191"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
